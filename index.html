<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE NOIR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --text: #e0e0e0;
            --accent: #ff3e3e; /* Signal Red */
            --muted: #666;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* High-End Header */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid var(--muted);
            padding: 20px;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
        }

        .logo {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(3rem, 15vw, 10rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -5px;
            margin: 0;
            line-height: 0.9;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--muted);
            animation: bounce 2s infinite;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }

        /* Main Content Grid */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .news-layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 60px;
        }

        /* Article Cards */
        .card {
            display: block;
            text-decoration: none;
            color: inherit;
            margin-bottom: 60px;
            position: relative;
        }

        .card:hover .img-container img { transform: scale(1.05); }
        .card:hover h2 { color: var(--accent); }

        .img-container {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: var(--surface);
            border-radius: 2px;
            margin-bottom: 20px;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.8);
        }

        .card:hover img { filter: grayscale(0%) brightness(1); }

        .category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 700;
            display: block;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 2.5rem;
            line-height: 1.1;
            margin: 0 0 15px 0;
            font-weight: 700;
        }

        p {
            color: var(--muted);
            line-height: 1.6;
            font-size: 1.1rem;
            max-width: 600px;
        }

        /* Sidebar Briefs */
        .sidebar {
            border-left: 1px solid var(--muted);
            padding-left: 60px;
        }

        .brief {
            padding: 20px 0;
            border-bottom: 1px solid var(--glass);
        }

        .brief h3 {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        /* Utility */
        .meta-bar {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--glass);
            background: var(--glass);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        @media (max-width: 900px) {
            .news-layout { grid-template-columns: 1fr; }
            .sidebar { border-left: none; padding-left: 0; }
            h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="meta-bar">
        <span>THE ALIF // DIGITAL ARCHIVE</span>
        <span id="date-display"></span>
        <span style="color: var(--accent)">● LIVE UPDATES</span>
    </div>

    <header>
        <h1 class="logo">ALIF<br>DAILY</h1>
        <div class="scroll-indicator">SCROLL TO READ</div>
    </header>

    <div class="container">
        <div id="loader">PRINTING DATA...</div>
        
        <div class="news-layout" id="news-content" style="display: none;">
            <div id="main-feed"></div>

            <div class="sidebar">
                <h4 style="letter-spacing: 4px; color: var(--muted); margin-bottom: 30px;">LATEST HEADLINES</h4>
                <div id="brief-feed"></div>
            </div>
        </div>
    </div>

    <script>
        const RSS_URL = 'https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en';
        const API = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

        async function fetchNews() {
            try {
                const res = await fetch(API);
                const data = await res.json();
                if (data.status === 'ok') render(data.items);
            } catch (e) {
                document.getElementById('loader').innerText = "SYSTEM ERROR: FEED DISCONNECTED";
            }
        }

        function render(items) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('news-content').style.display = 'grid';

            const feed = document.getElementById('main-feed');
            const briefs = document.getElementById('brief-feed');

            items.forEach((item, i) => {
                const cleanTitle = item.title.split(' - ')[0];
                const source = item.title.split(' - ')[1] || 'GLOBAL';

                if (i < 5) {
                    // Feature Cards
                    feed.innerHTML += `
                        <a href="${item.link}" target="_blank" class="card">
                            <span class="category">${source}</span>
                            <div class="img-container">
                                <img src="https://picsum.photos/1200/800?random=${i}" alt="News">
                            </div>
                            <h2>${cleanTitle}</h2>
                            <p>${item.description.replace(/<[^>]*>?/gm, '').substring(0, 150)}...</p>
                        </a>
                    `;
                } else if (i < 12) {
                    // Sidebar Briefs
                    briefs.innerHTML += `
                        <a href="${item.link}" target="_blank" class="card brief">
                            <span class="category" style="font-size: 0.6rem;">${source}</span>
                            <h3>${cleanTitle}</h3>
                        </a>
                    `;
                }
            });
        }

        document.getElementById('date-display').innerText = new Date().toLocaleDateString('en-US', {
            month: 'short', day: '2-digit', year: 'numeric'
        }).toUpperCase();

        fetchNews();
    </script>
</body>
</html>
