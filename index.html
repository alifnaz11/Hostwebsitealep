<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Alif Daily | Premium Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=EB+Garamond:wght@400;500&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper: #fdfcf8;
            --ink: #121212;
            --accent: #8b0000;
            --border: #222;
        }

        * { box-sizing: border-box; }

        body {
            background-color: #cacaca;
            color: var(--ink);
            font-family: 'EB Garamond', serif;
            margin: 0;
            padding: 0;
            /* Texture Overlay */
            background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
        }

        /* Newspaper Container */
        .newspaper-container {
            background-color: var(--paper);
            max-width: 1300px;
            margin: 40px auto;
            padding: 50px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            border: 1px solid #999;
            position: relative;
        }

        /* Breaking Ticker */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background: var(--ink);
            color: white;
            padding: 8px 0;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .ticker-move {
            display: flex;
            width: max-content;
            animation: ticker 30s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .meta-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--ink);
            border-bottom: 2px solid var(--ink);
            padding: 10px 0;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        h1.logo {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 10vw, 7rem);
            margin: 15px 0;
            font-weight: 900;
            letter-spacing: -3px;
            line-height: 0.8;
        }

        /* Grid Layout */
        .editorial-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 40px;
        }

        /* Article Styling */
        .article {
            margin-bottom: 40px;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: opacity 0.3s ease;
        }

        .article:hover { opacity: 0.8; }

        .main-col { grid-column: 1; border-right: 1px solid #ddd; padding-right: 40px; }
        
        .lead-headline {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            line-height: 1;
            margin: 0 0 20px 0;
            font-weight: 900;
        }

        /* First letter drop cap */
        .lead-text::first-letter {
            float: left;
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            line-height: 0.9;
            padding-right: 8px;
            font-weight: 900;
        }

        .sub-headline {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .article-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background-color: #eee;
            margin-bottom: 15px;
            filter: grayscale(0.2) contrast(1.1);
            border: 1px solid #ddd;
        }

        .source {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 5px;
            display: block;
        }

        p { font-size: 1.15rem; line-height: 1.5; margin-bottom: 15px; }

        @media (max-width: 1000px) {
            .editorial-grid { grid-template-columns: 1fr 1fr; }
            .main-col { grid-column: span 2; border-right: none; padding-right: 0; }
        }

        @media (max-width: 600px) {
            .editorial-grid { grid-template-columns: 1fr; }
            .main-col { grid-column: span 1; }
            .newspaper-container { padding: 20px; margin: 10px; }
            .lead-headline { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div class="ticker-wrap">
    <div class="ticker-move" id="ticker">
        LATEST UPDATES: CLOUD DATA FETCHED SUCCESSFULLY • THE ALIF DAILY IS NOW LIVE • PREMIUM NEWS EXPERIENCE REDESIGNED FOR 2026 •&nbsp;
    </div>
</div>

<div class="newspaper-container">
    <header>
        <div class="meta-line">
            <span>Vol. I — No. 001</span>
            <span id="current-date">MONDAY, MARCH 2, 2026</span>
            <span>PRICE: 0.00 MYR</span>
        </div>
        <h1 class="logo">The Alif Daily</h1>
        <div style="border-bottom: 4px solid var(--ink); margin-top: 10px;"></div>
    </header>

    <div id="loader" style="text-align: center; padding: 100px;">
        <p style="font-family: 'Inter'; text-transform: uppercase; letter-spacing: 2px;">Printing Edition...</p>
    </div>

    <div id="main-content" class="editorial-grid" style="display: none;">
        <div class="main-col" id="col-1"></div>

        <div class="side-col" id="col-2"></div>

        <div class="side-col" id="col-3"></div>
    </div>
</div>

<script>
    async function getNews() {
        const RSS_URL = 'https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en';
        const API = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

        try {
            const res = await fetch(API);
            const data = await res.json();
            if(data.status === 'ok') render(data.items);
        } catch(e) { 
            document.getElementById('loader').innerText = "Press Stalled. Check Connection."; 
        }
    }

    function render(items) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('main-content').style.display = 'grid';

        const c1 = document.getElementById('col-1');
        const c2 = document.getElementById('col-2');
        const c3 = document.getElementById('col-3');

        items.forEach((item, i) => {
            const cleanTitle = item.title.split(' - ')[0];
            const source = item.title.split(' - ')[1] || 'NEWS';
            
            // Add to ticker
            document.getElementById('ticker').innerHTML += ` ${cleanTitle.toUpperCase()} • `;

            if (i === 0) {
                // LEAD STORY
                c1.innerHTML = `
                    <a href="${item.link}" target="_blank" class="article">
                        <span class="source">Top Priority</span>
                        <h2 class="lead-headline">${cleanTitle}</h2>
                        <img src="https://picsum.photos/800/500?random=${i}" class="article-img">
                        <p class="lead-text">${item.description.replace(/<[^>]*>?/gm, '').substring(0, 300)}...</p>
                        <hr>
                    </a>
                `;
            } else if (i < 4) {
                // MID STORIES
                c2.innerHTML += `
                    <a href="${item.link}" target="_blank" class="article" style="border-bottom: 1px solid #ddd; padding-bottom: 20px;">
                        <span class="source">${source}</span>
                        <h3 class="sub-headline">${cleanTitle}</h3>
                        <p style="font-size: 0.95rem;">${item.description.replace(/<[^>]*>?/gm, '').substring(0, 100)}...</p>
                    </a>
                `;
            } else if (i < 9) {
                // BRIEFS
                c3.innerHTML += `
                    <a href="${item.link}" target="_blank" class="article" style="border-bottom: 1px dashed #999; padding-bottom: 15px;">
                        <span class="source">${source}</span>
                        <h3 class="sub-headline" style="font-size: 1.1rem;">${cleanTitle}</h3>
                    </a>
                `;
            }
        });
    }

    document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    }).toUpperCase();

    getNews();
</script>

</body>
</html>
