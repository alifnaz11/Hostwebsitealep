<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root[data-theme="light"] {
            --bg: #f4f4f2;
            --surface: #ffffff;
            --text: #1a1a1a;
            --muted: #666666;
            --accent: #d4af37; /* Gold */
            --border: rgba(0,0,0,0.1);
            --glass: rgba(255,255,255,0.8);
        }

        :root[data-theme="dark"] {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --text: #f0f0f0;
            --muted: #888888;
            --accent: #ffd700;
            --border: rgba(255,255,255,0.1);
            --glass: rgba(15,15,15,0.8);
        }

        * { box-sizing: border-box; transition: background 0.4s, color 0.4s; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            line-height: 1.6;
        }

        /* Glass Header */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -1px;
        }

        /* Theme Toggle */
        .theme-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
        }

        /* Layout */
        .hero {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }

        .main-story {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            text-decoration: none;
            color: white;
            background: #000;
        }

        .main-story img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.6;
            transition: transform 0.8s;
        }

        .main-story:hover img { transform: scale(1.05); opacity: 0.8; }

        .story-content { position: relative; z-index: 2; }

        .badge {
            background: var(--accent);
            color: #000;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .grid {
            max-width: 1200px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card:hover { transform: translateY(-5px); border-color: var(--accent); }

        .card h3 { margin: 0; font-size: 1.2rem; line-height: 1.3; }

        .card p { font-size: 0.9rem; color: var(--muted); margin: 0; }

        .footer-tag { font-size: 0.7rem; font-weight: 700; color: var(--accent); }

        #loader { text-align: center; padding: 100px; font-weight: 800; opacity: 0.5; }

        @media (max-width: 768px) {
            .hero { grid-template-columns: 1fr; }
            .main-story { height: 400px; padding: 20px; }
            nav { padding: 15px 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="brand">ALIF // MSIA</div>
        <button class="theme-btn" onclick="toggleTheme()">SWITCH THEME</button>
    </nav>

    <div id="loader">FETCHING MALAYSIAN HEADLINES...</div>

    <section id="content" style="display: none;">
        <div class="hero" id="hero-section">
            </div>

        <div class="grid" id="news-grid">
            </div>
    </section>

    <script>
        // Theme Logic
        function toggleTheme() {
            const root = document.documentElement;
            const current = root.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
        }

        // Apply saved theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Fetch Malaysia News (gl=MY and ceid=MY:en targets Malaysia)
        async function fetchMYNews() {
            const RSS = 'https://news.google.com/rss?hl=en-MY&gl=MY&ceid=MY:en';
            const API = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS)}`;

            try {
                const res = await fetch(API);
                const data = await res.json();
                if (data.status === 'ok') render(data.items);
            } catch (e) {
                document.getElementById('loader').innerText = "FAILED TO CONNECT TO PRESS";
            }
        }

        function render(items) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            const heroSection = document.getElementById('hero-section');
            const grid = document.getElementById('news-grid');

            items.forEach((item, i) => {
                const title = item.title.split(' - ')[0];
                const source = item.title.split(' - ')[1] || 'MALAYSIA NEWS';
                const desc = item.description.replace(/<[^>]*>?/gm, '').substring(0, 150);

                if (i === 0) {
                    heroSection.innerHTML = `
                        <a href="${item.link}" target="_blank" class="main-story">
                            <img src="https://picsum.photos/1200/800?random=msia" alt="Hero">
                            <div class="story-content">
                                <span class="badge">Breaking Malaysia</span>
                                <h1 style="font-size: 2.5rem; margin: 15px 0;">${title}</h1>
                                <p style="color: #ddd;">${desc}...</p>
                            </div>
                        </a>
                        <div style="display: flex; flex-direction: column; gap: 20px;">
                            <div class="card" style="flex: 1;">
                                <span class="footer-tag">REGIONAL UPDATE</span>
                                <h3>The latest developments across the Peninsula and Borneo.</h3>
                            </div>
                            
                        </div>
                    `;
                } else {
                    grid.innerHTML += `
                        <a href="${item.link}" target="_blank" class="card">
                            <span class="footer-tag">${source}</span>
                            <h3>${title}</h3>
                            <p>${desc}...</p>
                            <span style="font-size: 0.7rem; opacity: 0.5;">${item.pubDate}</span>
                        </a>
                    `;
                }
            });
        }

        fetchMYNews();
    </script>
</body>
</html>
